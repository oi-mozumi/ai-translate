# AI Translate - the build robot.
#
# A copy of this file lives in the GitHub repository that publishes the
# ready-made builds, at .github/workflows/build.yml. Every hour it fetches
# build/github.sh from the plugin's latest release on GitLab and runs it, and
# that script decides whether there is anything new to build. It uses no
# ready-made GitHub actions, only what every GitHub runner already has, so
# nothing in it goes out of date.

name: Build

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build AI Translate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://gitlab.com/oi_mozumi/ai-translate/-/raw/release/build/github.sh -o github.sh
          bash github.sh
